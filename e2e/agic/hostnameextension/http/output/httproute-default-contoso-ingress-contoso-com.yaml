apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: contoso-ingress-contoso-com
  namespace: default
spec:
  hostnames:
  - contoso.com
  - example.com
  - example2.com
  parentRefs:
  - name: alb-gateway
    sectionName: http
  rules:
  - backendRefs:
    - name: contoso-service
      port: 80
    matches:
    - path:
        type: Exact
        value: /
