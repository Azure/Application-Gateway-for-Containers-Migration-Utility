apiVersion: alb.networking.azure.io/v1
kind: RoutePolicy
metadata:
  name: contoso-ingress-contoso-com-policy
  namespace: default
spec:
  default:
    sessionAffinity:
      affinityType: managed-cookie
      cookieDuration: 0s
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: contoso-ingress-contoso-com
    namespace: default
