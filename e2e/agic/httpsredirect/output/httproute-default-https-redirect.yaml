apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: alb-gateway
    namespace: default
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        scheme: https
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
