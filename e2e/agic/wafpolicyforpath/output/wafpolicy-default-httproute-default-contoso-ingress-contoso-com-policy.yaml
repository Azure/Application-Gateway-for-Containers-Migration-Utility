apiVersion: alb.networking.azure.io/v1
kind: WebApplicationFirewallPolicy
metadata:
  name: httproute-default-contoso-ingress-contoso-com-policy
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: contoso-ingress-contoso-com
    namespace: default
  webApplicationFirewall:
    id: /subscriptions/my-sub/resourceGroups/rg/providers/Microsoft.Network/applicationGatewayWebApplicationFirewallPolicies/my-policy
