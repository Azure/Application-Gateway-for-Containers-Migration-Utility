apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingress-https-contoso-com
  namespace: default
spec:
  hostnames:
  - contoso.com
  parentRefs:
  - name: alb-gateway
    sectionName: http
  rules:
  - backendRefs:
    - name: contoso-service
      port: 443
    matches:
    - path:
        type: Exact
        value: /https-backend/
