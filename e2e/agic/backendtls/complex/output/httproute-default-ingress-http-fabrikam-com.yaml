apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingress-http-fabrikam-com
  namespace: default
spec:
  hostnames:
  - fabrikam.com
  parentRefs:
  - name: alb-gateway
    sectionName: http
  rules:
  - backendRefs:
    - name: fabrikam-service
      port: 80
    matches:
    - path:
        type: Exact
        value: /http-backend/
