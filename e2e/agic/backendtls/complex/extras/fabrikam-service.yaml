apiVersion: v1
kind: Service
metadata:
  labels:
    app: fabrikam-service
  name: fabrikam-service
  namespace: default
spec:
  ports:
  - port: 80
    name: http
    protocol: TCP
    targetPort: 3000
  - port: 443
    name: https
    protocol: TCP
    targetPort: 3001
  selector:
    app: fabrikam-service
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: fabrikam-service
  name: fabrikam-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fabrikam-service
  template:
    metadata:
      labels:
        app: fabrikam-service
    spec:
      containers:
      - image: trafficcontrollertestimages.azurecr.io/echoserver:v20220815-e21d1a4
        name: echo
        ports:
          - containerPort: 3000
          - containerPort: 3001
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
